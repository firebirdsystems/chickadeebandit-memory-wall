<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Wall</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --red: #b91c1c;
      --red-soft: #fee2e2;
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }
    .app { max-width: 680px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    h2 { font-size: 1.05rem; line-height: 1.25; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 10px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .card-link { cursor: pointer; }
    .card-link:hover { border-color: var(--border-mid); }
    .item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .item-title { font-weight: 700; }
    .item-meta { margin-top: 2px; color: var(--muted); font-size: .8rem; }
    .badge {
      display: inline-block; border: 1px solid var(--border); border-radius: 999px;
      padding: 1px 8px; font-size: .72rem; font-weight: 700; color: var(--muted);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer;
      min-height: 38px; background: var(--accent); color: var(--accent-fg);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-sm { min-height: 30px; padding: 4px 8px; font-size: .78rem; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-quiet {
      min-height: 28px; padding: 3px 8px; background: transparent; color: var(--muted);
      border: 0; font-size: .76rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-quiet:hover { background: var(--bg); color: var(--text); }
    .btn-quiet-danger:hover { background: var(--red-soft); color: var(--red); }
    .form { display: grid; gap: 10px; margin-bottom: 14px; }
    .field { display: grid; gap: 4px; }
    label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    .check { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: .84rem; font-weight: 600; color: var(--text); }
    input, textarea, select {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    input[type="checkbox"] { width: auto; }
    textarea { min-height: 70px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .empty, .loading { color: var(--muted); text-align: center; padding: 28px 16px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .notice { background: var(--bg); color: var(--muted); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .82rem; border: 1px solid var(--border); }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .thumb {
      width: 96px; height: 96px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--border); display: block;
    }
    .thumb-wrap { position: relative; }
    .thumb-drop {
      position: absolute; top: 2px; right: 2px; border: 0; border-radius: 999px;
      width: 22px; height: 22px; line-height: 1; cursor: pointer; font-weight: 800;
      background: rgba(17, 24, 39, .78); color: #fff; font-size: .8rem; padding: 0;
    }
    .cover { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius); margin-bottom: 10px; }
    .post-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .post-body { margin-top: 4px; white-space: pre-wrap; }
    .post-hidden { opacity: .55; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1000;
    }
    .modal {
      background: var(--surface); color: var(--text); border-radius: var(--radius);
      max-width: 520px; width: 100%; padding: 20px; max-height: 90vh; overflow: auto;
    }
    .link-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .search-input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
      margin-bottom: 10px;
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/memory-wall/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading…</div>
</div>

<script type="module">
import { esc, isAdult, hubConfirm, hubAlert, createFilesHelper, createShareHelper, searchMatch, hubToday } from "/hub-sdk.js";
import {
  parseIds, isGuestPost, canPostTo, formatDate, formatWhen,
  memberName as memberNameOf, wallById as wallByIdOf, postAuthor as postAuthorOf,
  canManageWalls as canManageWallsOf, canModerate as canModerateOf,
  canEditPost as canEditPostOf, visiblePosts as visiblePostsOf,
  searchableFields, postSearchableFields,
} from "./logic.js";

// --- Hub runtime globals (empty in demo mode) --------------------------------
const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const FILES_URL = window.__FILES_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const LIMITS = window.__RESOURCE_LIMITS ?? {};

const files = createFilesHelper(FILES_URL);
const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);

// Mirrors the hub's own upload allowlist for images. A wall is a photo surface,
// so anything else is rejected here rather than after a round trip.
const IMAGE_TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif", "image/heic", "image/heif"];
// Per post, matching the share-link feed's per-entry ceiling — a post that
// carried more would have photos silently missing from the public wall.
const MAX_PHOTOS_PER_POST = 12;

// --- App state ---------------------------------------------------------------
let members = [];
let currentMember = null;
let walls = [];
let posts = [];              // posts of the open wall only
let openWallId = null;
let view = "list";           // list | wall | new-wall | settings
let wallQ = "";              // walls-list search (see logic.js searchableFields)
let postQ = "";              // in-wall message search (postSearchableFields)
let error = "";
let notice = "";
let pendingPhotos = [];      // { id, url, name } uploaded but not yet attached to a post
let uploading = false;
let shareModalEl = null;
let shareLinks = [];
let shareEntitled = false;

function nowIso() { return new Date().toISOString(); }

// Thin bindings over src/logic.js — the pure functions there take the roster,
// the wall list and an is-adult flag explicitly so Node can unit-test them.
function memberName(id) { return memberNameOf(members, id); }
function wallById(id) { return wallByIdOf(walls, id); }
function postAuthor(post) { return postAuthorOf(post, members); }
function canModerate() { return canModerateOf(isAdult(currentMember)); }
function canEditPost(post) {
  return canEditPostOf(post, { isAdultMember: isAdult(currentMember), memberId: currentMember?.id });
}
function canManageWalls() { return canManageWallsOf(isAdult(currentMember)); }

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
    ];
  } else {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
  }
  currentMember = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

async function loadWalls() {
  if (!DB) {
    walls = [{
      id: "demo-wall",
      title: "Ben's Birthday",
      occasion_date: hubToday(),
      description: "He turns six on Saturday. Leave him something to read.",
      cover_file_ids: "[]",
      status: "open",
      post_visibility: "everyone",
      created_by: "demo-1",
      created_at: nowIso(),
      post_count: 1,
    }];
    return;
  }
  // Two statements, not one correlated subquery: the row-policy rewriter
  // REJECTS a governed table referenced inside a subquery ("references governed
  // table ... inside a CTE or subquery, which is not supported"), and a
  // rejection is total — the walls list would never load at all. The separate
  // count also gets the posts policy applied on its own, so each member's
  // counts reflect what that member may actually see.
  const [wallRows, countRows] = await Promise.all([
    db("SELECT * FROM app_memory_wall__walls WHERE status IN ('open', 'closed') ORDER BY created_at DESC"),
    db("SELECT wall_id, COUNT(*) AS post_count FROM app_memory_wall__posts WHERE status = 'published' GROUP BY wall_id"),
  ]);
  const counts = new Map(countRows.rows.map(r => [r.wall_id, Number(r.post_count) || 0]));
  walls = wallRows.rows.map(w => ({ ...w, post_count: counts.get(w.id) ?? 0 }));
}

async function loadPosts(wallId) {
  if (!DB) {
    posts = [{
      id: "demo-post",
      wall_id: "demo-wall",
      member_id: "demo-2",
      author_name: "",
      body: "Happy birthday Ben! Hope the cake is enormous.",
      file_ids: "[]",
      source: "member",
      status: "published",
      visibility: "everyone",
      created_at: nowIso(),
    }];
    return;
  }
  // Row policies already hide other members' private posts; ordering and the
  // moderation filter are ours.
  const { rows } = await db(
    "SELECT * FROM app_memory_wall__posts WHERE wall_id = ? ORDER BY created_at DESC",
    [wallId],
  );
  posts = rows;
}

async function refresh() {
  error = "";
  try {
    await Promise.all([loadMembers(), loadWalls()]);
    if (openWallId) {
      if (!wallById(openWallId)) { openWallId = null; view = "list"; }
      else await loadPosts(openWallId);
    }
    render();
  } catch (e) {
    error = e.message;
    render();
  }
}

// --- Walls -------------------------------------------------------------------

async function createWall(form) {
  if (!canManageWalls()) { error = "Only adults can open a wall."; return render(); }
  const title = form.title.value.trim();
  if (!title) { form.title.focus(); return; }

  const wall = {
    id: crypto.randomUUID(),
    title,
    occasion_date: form.occasion_date.value || "",
    description: form.description.value.trim(),
    cover_file_ids: "[]",
    status: "open",
    post_visibility: "everyone",
    created_by: currentMember.id,
    created_at: nowIso(),
  };
  try {
    await db(
      `INSERT INTO app_memory_wall__walls
         (id, title, occasion_date, description, cover_file_ids, status, post_visibility, created_by, created_at)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [wall.id, wall.title, wall.occasion_date, wall.description, wall.cover_file_ids,
       wall.status, wall.post_visibility, wall.created_by, wall.created_at],
    );
    walls = [{ ...wall, post_count: 0 }, ...walls];
    openWallId = wall.id;
    posts = [];
    postQ = "";
    view = "wall";
    error = "";
    render();
  } catch (e) { error = e.message; render(); }
}

async function saveWallSettings(form) {
  const wall = wallById(openWallId);
  if (!wall || !canManageWalls()) { error = "Only adults can change a wall."; return render(); }
  const patch = {
    title: form.title.value.trim() || wall.title,
    occasion_date: form.occasion_date.value || "",
    description: form.description.value.trim(),
    status: form.status.value,
    post_visibility: form.post_visibility.value,
  };
  try {
    await db(
      `UPDATE app_memory_wall__walls
         SET title = ?, occasion_date = ?, description = ?, status = ?, post_visibility = ?
       WHERE id = ?`,
      [patch.title, patch.occasion_date, patch.description, patch.status, patch.post_visibility, wall.id],
    );
    Object.assign(wall, patch);
    // An archived wall drops out of the list query — and out of every share
    // link, since shareable.visible_where admits only open/closed.
    if (patch.status === "archived") {
      walls = walls.filter(w => w.id !== wall.id);
      openWallId = null;
      view = "list";
      notice = `"${patch.title}" was archived. Its share links no longer resolve.`;
    } else {
      view = "wall";
    }
    error = "";
    render();
  } catch (e) { error = e.message; render(); }
}

async function setCoverPhoto(input) {
  const wall = wallById(openWallId);
  const file = input.files?.[0];
  input.value = "";
  if (!wall || !file) return;
  try {
    const uploaded = await uploadImage(file);
    const previous = parseIds(wall.cover_file_ids);
    await db("UPDATE app_memory_wall__walls SET cover_file_ids = ? WHERE id = ?",
      [JSON.stringify([uploaded.id]), wall.id]);
    wall.cover_file_ids = JSON.stringify([uploaded.id]);
    // The replaced cover is now referenced by nothing — reclaim it. (The row
    // survives the edit, so no delete_* lane covers this one.)
    for (const id of previous) await files.delete(id).catch(() => {});
    error = "";
    render();
  } catch (e) { error = e.message; render(); }
}

async function deleteWall(id) {
  if (!canManageWalls()) return;
  const wall = wallById(id);
  if (!await hubConfirm(`Delete "${wall?.title ?? "this wall"}"?`, {
    description: "Every message and photo on it is deleted too. This cannot be undone.",
    confirmLabel: "Delete",
  })) return;
  try {
    // Posts are deleted first, on purpose: delete_file_list_columns reclaims
    // each post's photos on ITS delete, while the walls -> posts delete_cascade
    // can only drop rows. Deleting the parent alone would strand the photos.
    await db("DELETE FROM app_memory_wall__posts WHERE wall_id = ?", [id]);
    for (const fileId of parseIds(wall?.cover_file_ids)) await files.delete(fileId).catch(() => {});
    await db("DELETE FROM app_memory_wall__walls WHERE id = ?", [id]);
    walls = walls.filter(w => w.id !== id);
    if (openWallId === id) { openWallId = null; posts = []; view = "list"; }
    error = "";
    render();
  } catch (e) { error = e.message; render(); }
}

// --- Photos ------------------------------------------------------------------

async function uploadImage(file) {
  if (!IMAGE_TYPES.includes(file.type)) {
    throw new Error(`${file.name} isn't an image the hub accepts (JPEG, PNG, WebP, GIF or HEIC).`);
  }
  const max = LIMITS.max_file_bytes ?? 10 * 1024 * 1024;
  if (file.size > max) {
    throw new Error(`${file.name} is larger than the ${Math.round(max / (1024 * 1024))} MB limit.`);
  }
  return files.upload(file);
}

async function addPendingPhotos(input) {
  const chosen = [...(input.files ?? [])];
  input.value = "";
  if (!chosen.length) return;
  if (pendingPhotos.length + chosen.length > MAX_PHOTOS_PER_POST) {
    error = `A post can carry ${MAX_PHOTOS_PER_POST} photos.`;
    return render();
  }
  uploading = true;
  error = "";
  render();
  try {
    for (const file of chosen) {
      const { id } = await uploadImage(file);
      // Uploaded before the post row exists, so a cancelled composer has to
      // reclaim them — see discardPendingPhotos.
      pendingPhotos.push({ id, name: file.name, url: files.url(id) });
    }
  } catch (e) {
    error = e.message;
  } finally {
    uploading = false;
    render();
  }
}

async function dropPendingPhoto(id) {
  pendingPhotos = pendingPhotos.filter(p => p.id !== id);
  await files.delete(id).catch(() => {});
  render();
}

async function discardPendingPhotos() {
  const stale = pendingPhotos;
  pendingPhotos = [];
  for (const photo of stale) await files.delete(photo.id).catch(() => {});
}

// --- Posts -------------------------------------------------------------------

async function createPost(form) {
  const wall = wallById(openWallId);
  if (!wall) return;
  if (!canPostTo(wall)) { error = "This wall is closed to new messages."; return render(); }
  const body = form.body.value.trim();
  if (!body && pendingPhotos.length === 0) { form.body.focus(); return; }

  const post = {
    id: crypto.randomUUID(),
    wall_id: wall.id,
    member_id: currentMember.id,
    // Denormalized on purpose: the share page's feed projects columns from this
    // row and cannot join the roster, so an empty author_name would render
    // every member's message as an anonymous card to visitors. In-app rendering
    // still prefers the roster name, so a later rename follows old posts there.
    author_name: currentMember.name ?? "",
    body,
    file_ids: JSON.stringify(pendingPhotos.map(p => p.id)),
    source: "member",
    status: "published",
    visibility: form.private.checked ? "private" : "everyone",
    created_at: nowIso(),
  };
  try {
    await db(
      `INSERT INTO app_memory_wall__posts
         (id, wall_id, member_id, author_name, body, file_ids, source, status, visibility, created_at)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [post.id, post.wall_id, post.member_id, post.author_name, post.body, post.file_ids,
       post.source, post.status, post.visibility, post.created_at],
    );
    posts = [post, ...posts];
    pendingPhotos = [];
    form.reset();
    error = "";
    render();
  } catch (e) { error = e.message; render(); }
}

async function setPostStatus(id, status) {
  if (!canModerate()) return;
  try {
    await db("UPDATE app_memory_wall__posts SET status = ? WHERE id = ?", [status, id]);
    const post = posts.find(p => p.id === id);
    if (post) post.status = status;
    error = "";
    render();
  } catch (e) { error = e.message; render(); }
}

async function deletePost(id) {
  const post = posts.find(p => p.id === id);
  if (!post || !canEditPost(post)) return;
  if (!await hubConfirm("Delete this message?", {
    description: parseIds(post.file_ids).length ? "Its photos are deleted with it." : undefined,
    confirmLabel: "Delete",
  })) return;
  try {
    // Single-statement DELETE on purpose: delete_file_list_columns reclaims
    // file_ids from this row, and the batch form refuses a declared table
    // rather than skipping the reclaim.
    await db("DELETE FROM app_memory_wall__posts WHERE id = ?", [id]);
    posts = posts.filter(p => p.id !== id);
    error = "";
    render();
  } catch (e) { error = e.message; render(); }
}

// --- Share links -------------------------------------------------------------

function closeShareModal() {
  shareModalEl?.remove();
  shareModalEl = null;
}

function openShareBackdrop(html) {
  closeShareModal();
  shareModalEl = document.createElement("div");
  shareModalEl.className = "modal-backdrop";
  shareModalEl.innerHTML = `<div class="modal">${html}</div>`;
  shareModalEl.addEventListener("click", (e) => { if (e.target === shareModalEl) closeShareModal(); });
  document.body.appendChild(shareModalEl);
}

async function openShareModal(wallId) {
  const wall = wallById(wallId);
  if (!wall) return;
  const status = await share.status();
  shareLinks = status.links;
  shareEntitled = status.entitled;
  const active = shareLinks.filter(l =>
    l.itemId === wallId && !l.revokedAt && new Date(l.expiresAt) > new Date());

  const rows = active.map(l => `
    <div class="link-row">
      <div style="flex:1;min-width:0">
        <input readonly value="${esc(l.url)}" onclick="this.select()" class="tiny" />
        <div class="tiny muted" style="margin-top:3px">
          Expires ${formatDate(l.expiresAt)} · ${l.viewCount} view${l.viewCount === 1 ? "" : "s"}${
            l.writable ? ` · ${l.submissionCount} guest message${l.submissionCount === 1 ? "" : "s"} · ✍️ collects messages` : ""}${
            l.hasPassword ? " · 🔒 password" : ""}
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" data-share-copy="${esc(l.id)}">Copy</button>
      <button class="btn btn-ghost btn-sm" data-share-revoke="${esc(l.id)}" data-wall-id="${esc(wallId)}">Revoke</button>
    </div>`).join("");

  // Premium (`sharing`) controls: guest messages, password, 1-year expiry.
  // Shown only to entitled households — no in-app upsell.
  const premiumControls = shareEntitled ? `
    <label class="check" style="margin-top:10px">
      <input type="checkbox" id="share-writable" /> Let guests add their own messages
    </label>
    <input id="share-password" type="text" placeholder="Optional password (min 6 characters)"
      autocomplete="off" class="tiny" style="margin-top:8px" />
  ` : "";

  const privacyNote = wall.post_visibility === "everyone"
    ? "Visitors will see the occasion and every published message on it."
    : "Visitors will see the occasion only — messages stay inside the household while this wall is set to organizers only.";

  openShareBackdrop(`
    <h2>Share "${esc(wall.title)}"</h2>
    <p class="tiny muted" style="margin:6px 0 10px">
      ${esc(privacyNote)} No account needed, and links expire automatically.
    </p>
    ${rows || `<p class="tiny muted" style="padding:8px 0">No active links yet.</p>`}
    ${premiumControls}
    <div class="row" style="margin-top:14px">
      <select id="share-expiry" class="tiny" style="width:auto">
        <option value="24">1 day</option>
        <option value="168" selected>7 days</option>
        <option value="720">30 days</option>
        ${shareEntitled ? `<option value="8760">1 year</option>` : ""}
      </select>
      <button class="btn" data-share-create="${esc(wallId)}">Create link</button>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn btn-ghost" data-share-close>Close</button>
    </div>
  `);
}

async function createShare(wallId) {
  const wall = wallById(wallId);
  const hours = Number(document.getElementById("share-expiry")?.value) || undefined;
  const writable = !!document.getElementById("share-writable")?.checked;
  const password = document.getElementById("share-password")?.value?.trim() || undefined;
  const btn = shareModalEl?.querySelector("[data-share-create]");
  if (btn) { btn.disabled = true; btn.textContent = "Creating…"; }
  try {
    const link = await share.create("wall", wallId, { expiresInHours: hours, label: wall?.title, writable, password });
    try { await navigator.clipboard.writeText(link.url); } catch { /* the re-render shows the url to copy */ }
    await openShareModal(wallId);
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "Create link"; }
    hubAlert("Couldn't create share link", { description: err.message });
  }
}

async function copyShare(id) {
  const link = shareLinks.find(l => l.id === id);
  if (!link) return;
  try { await navigator.clipboard.writeText(link.url); }
  catch { hubAlert("Couldn't copy — select the link text and copy it manually."); }
}

async function revokeShare(id, wallId) {
  if (!await hubConfirm("Revoke this share link?", {
    description: "Anyone using it loses access immediately.",
    confirmLabel: "Revoke",
  })) return;
  try { await share.revoke(id); await openShareModal(wallId); }
  catch (err) { hubAlert("Couldn't revoke share link", { description: err.message }); }
}

// --- Rendering ---------------------------------------------------------------

function renderWallCard(wall) {
  const count = Number(wall.post_count ?? 0);
  return `
    <article class="card card-link" data-open-wall="${esc(wall.id)}" data-testid="wall-card" data-wall-id="${esc(wall.id)}">
      <div class="item-head">
        <div>
          <div class="item-title">${esc(wall.title)}</div>
          ${wall.occasion_date ? `<div class="item-meta">${esc(formatDate(wall.occasion_date))}</div>` : ""}
          <div class="item-meta tiny">
            ${count} message${count === 1 ? "" : "s"}${wall.post_visibility === "organizers" ? " · 🔒 not shown to visitors" : ""}
          </div>
        </div>
        ${wall.status === "closed" ? `<span class="badge">Closed</span>` : ""}
      </div>
    </article>`;
}

// Owns the filtering and the empty states, so the keystroke handler can refresh
// the list without repeating how it is derived.
function renderWallCards() {
  const shown = wallQ ? walls.filter(w => searchMatch(wallQ, searchableFields(w))) : walls;
  if (shown.length) return shown.map(renderWallCard).join("");
  if (wallQ) return `<div class="card empty">No walls match "${esc(wallQ)}".</div>`;
  return `<div class="card empty">No walls yet.${canManageWalls() ? " Open one for the next occasion." : ""}</div>`;
}

function renderList() {
  return `
    ${walls.length ? `<input id="wall-search" class="search-input" type="search"
      placeholder="Search walls…" aria-label="Search walls" value="${esc(wallQ)}" />` : ""}
    <div id="wall-list" class="stack">${renderWallCards()}</div>`;
}

function renderPhotoStrip(fileIds, { removable = false } = {}) {
  if (!fileIds.length || !FILES_URL) return "";
  return `<div class="thumbs">${fileIds.map(id => `
    <div class="thumb-wrap">
      <a href="${esc(files.url(id))}" target="_blank" rel="noreferrer">
        <img class="thumb" src="${esc(files.url(id))}" alt="" loading="lazy" />
      </a>
      ${removable ? `<button class="thumb-drop" data-drop-photo="${esc(id)}" aria-label="Remove photo">×</button>` : ""}
    </div>`).join("")}</div>`;
}

function renderPost(post) {
  const photos = parseIds(post.file_ids);
  const hidden = post.status !== "published";
  return `
    <article class="card ${hidden ? "post-hidden" : ""}" data-testid="post-card" data-post-id="${esc(post.id)}" data-post-status="${esc(post.status)}">
      <div class="post-head">
        <div>
          <span class="item-title">${esc(postAuthor(post))}</span>
          ${isGuestPost(post) ? `<span class="badge" style="margin-left:6px">Guest</span>` : ""}
          ${post.visibility === "private" ? `<span class="badge" style="margin-left:6px">🔒 Private</span>` : ""}
          ${hidden ? `<span class="badge" style="margin-left:6px">Hidden</span>` : ""}
        </div>
        <span class="tiny muted">${esc(formatWhen(post.created_at))}</span>
      </div>
      ${post.body ? `<div class="post-body">${esc(post.body)}</div>` : ""}
      ${renderPhotoStrip(photos)}
      ${canEditPost(post) ? `
        <div class="row" style="margin-top:8px">
          ${canModerate() ? `
            <button class="btn-quiet" data-post-status="${esc(post.id)}" data-status="${hidden ? "published" : "hidden"}" data-testid="post-moderate" data-post-id="${esc(post.id)}">
              ${hidden ? "Show on the wall" : "Hide from the wall"}
            </button>` : ""}
          <button class="btn-quiet btn-quiet-danger" data-delete-post="${esc(post.id)}" data-testid="post-delete" data-post-id="${esc(post.id)}">Delete</button>
        </div>` : ""}
    </article>`;
}

// Moderated-off posts stay visible to a moderator (visiblePosts), and the
// search filters whatever that leaves — so hiding a post also drops it out of
// every other member's search results, not just their wall.
function renderPostCards() {
  const visible = visiblePostsOf(posts, isAdult(currentMember));
  const shown = postQ
    ? visible.filter(p => searchMatch(postQ, postSearchableFields(p, members)))
    : visible;
  if (shown.length) return shown.map(renderPost).join("");
  if (postQ) return `<div class="card empty">No messages match "${esc(postQ)}".</div>`;
  return `<div class="card empty">No messages yet.</div>`;
}

function renderComposer(wall) {
  if (!canPostTo(wall)) {
    return `<div class="notice">This wall is closed — no new messages.</div>`;
  }
  return `
    <form class="card form" id="post-form">
      <div class="field">
        <label for="body">Your message</label>
        <textarea id="body" name="body" data-autofocus maxlength="4000"
          placeholder="Write something for the wall…"></textarea>
      </div>
      ${FILES_URL ? `
        <div class="field">
          <label for="photos">Photos</label>
          <input id="photos" type="file" accept="${IMAGE_TYPES.join(",")}" multiple />
          ${renderPhotoStrip(pendingPhotos.map(p => p.id), { removable: true })}
        </div>` : ""}
      <label class="check">
        <input type="checkbox" name="private" />
        Keep this private — only I and the adults here can see it, never a share link
      </label>
      <button class="btn" type="submit" ${uploading ? "disabled" : ""}>
        ${uploading ? "Uploading…" : "Add to the wall"}
      </button>
    </form>`;
}

function renderWall() {
  const wall = wallById(openWallId);
  if (!wall) return `<div class="card empty">That wall is gone.</div>`;
  const cover = parseIds(wall.cover_file_ids)[0];

  return `
    <div class="topbar">
      <div>
        <button class="btn-quiet" data-back>← All walls</button>
        <h1>${esc(wall.title)}</h1>
        <p class="muted tiny">
          ${wall.occasion_date ? esc(formatDate(wall.occasion_date)) : ""}
          ${wall.post_visibility === "organizers" ? " · 🔒 messages hidden from visitors" : ""}
        </p>
      </div>
      <div class="row">
        ${share.enabled && canManageWalls() ? `<button class="btn btn-ghost btn-sm" data-share="${esc(wall.id)}">🔗 Share</button>` : ""}
        ${canManageWalls() ? `<button class="btn btn-ghost btn-sm" data-settings data-testid="wall-settings">Settings</button>` : ""}
      </div>
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${cover && FILES_URL ? `<img class="cover" src="${esc(files.url(cover))}" alt="" />` : ""}
    ${wall.description ? `<p class="muted" style="margin-bottom:12px">${esc(wall.description)}</p>` : ""}
    ${renderComposer(wall)}
    ${posts.length ? `<input id="post-search" class="search-input" type="search"
      placeholder="Search messages…" aria-label="Search messages" value="${esc(postQ)}" />` : ""}
    <section id="post-list" class="stack" data-testid="post-list">${renderPostCards()}</section>`;
}

function renderSettings() {
  const wall = wallById(openWallId);
  if (!wall) return `<div class="card empty">That wall is gone.</div>`;
  return `
    <div class="topbar">
      <div>
        <button class="btn-quiet" data-back-to-wall>← Back to the wall</button>
        <h1>Wall settings</h1>
      </div>
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    <form class="card form" id="settings-form">
      <div class="field">
        <label for="s-title">Title</label>
        <input id="s-title" name="title" value="${esc(wall.title)}" required />
      </div>
      <div class="field">
        <label for="s-date">Occasion date</label>
        <input id="s-date" name="occasion_date" type="date" value="${esc(wall.occasion_date ?? "")}" />
      </div>
      <div class="field">
        <label for="s-description">About</label>
        <textarea id="s-description" name="description">${esc(wall.description ?? "")}</textarea>
      </div>
      <div class="field">
        <label for="s-status">Status</label>
        <select id="s-status" name="status">
          <option value="open" ${wall.status === "open" ? "selected" : ""}>Open — accepting messages</option>
          <option value="closed" ${wall.status === "closed" ? "selected" : ""}>Closed — read only, links still work</option>
          <option value="archived">Archived — hidden, share links stop resolving</option>
        </select>
      </div>
      <div class="field">
        <label for="s-visibility">Who sees the messages</label>
        <select id="s-visibility" name="post_visibility">
          <option value="everyone" ${wall.post_visibility === "everyone" ? "selected" : ""}>
            Everyone with the link — the wall is shared
          </option>
          <option value="organizers" ${wall.post_visibility === "organizers" ? "selected" : ""}>
            Organizers only — visitors see the occasion, not the messages
          </option>
        </select>
      </div>
      <button class="btn" type="submit">Save</button>
    </form>
    ${FILES_URL ? `
      <div class="card form">
        <div class="field">
          <label for="cover">Cover photo</label>
          <input id="cover" type="file" accept="${IMAGE_TYPES.join(",")}" />
        </div>
        ${renderPhotoStrip(parseIds(wall.cover_file_ids))}
      </div>` : ""}
    <div class="card">
      <button class="btn-quiet btn-quiet-danger" data-delete-wall="${esc(wall.id)}">Delete this wall</button>
    </div>`;
}

function renderNewWall() {
  return `
    <div class="topbar">
      <div>
        <button class="btn-quiet" data-back>← All walls</button>
        <h1>New wall</h1>
      </div>
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    <form class="card form" id="wall-form">
      <div class="field">
        <label for="w-title">What's the occasion?</label>
        <input id="w-title" name="title" data-autofocus placeholder="Ben's Birthday" required />
      </div>
      <div class="field">
        <label for="w-date">Date</label>
        <input id="w-date" name="occasion_date" type="date" />
      </div>
      <div class="field">
        <label for="w-description">About</label>
        <textarea id="w-description" name="description" placeholder="What should people know before they write?"></textarea>
      </div>
      <button class="btn" type="submit">Open the wall</button>
    </form>`;
}

function render() {
  const root = document.getElementById("root");
  root.className = "app";

  if (view === "wall") root.innerHTML = renderWall();
  else if (view === "settings") root.innerHTML = renderSettings();
  else if (view === "new-wall") root.innerHTML = renderNewWall();
  else {
    root.innerHTML = `
      <div class="topbar">
        <div>
          <h1>Memory Wall</h1>
          <p class="muted tiny">Collect everyone's messages and photos for an occasion.</p>
        </div>
        <div class="row">
          ${canManageWalls() ? `<button class="btn btn-sm" data-new-wall data-testid="new-wall">New wall</button>` : ""}
          <button class="btn btn-ghost btn-sm" type="button" data-refresh>Refresh</button>
        </div>
      </div>
      ${error ? `<div class="error">${esc(error)}</div>` : ""}
      ${notice ? `<div class="notice">${esc(notice)}</div>` : ""}
      <section class="stack">${renderList()}</section>`;
    notice = "";
  }

  // Programmatic focus, never the autofocus attribute — the app renders inside
  // an iframe and the attribute would steal focus from the hub around it.
  root.querySelector("[data-autofocus]")?.focus();
}

// --- Events ------------------------------------------------------------------

// Re-render only the affected list on each keystroke so the search box keeps
// focus and the caret does not jump to the end mid-word.
document.addEventListener("input", (event) => {
  if (event.target.id === "wall-search") {
    wallQ = event.target.value;
    const el = document.getElementById("wall-list");
    if (el) el.innerHTML = renderWallCards();
  } else if (event.target.id === "post-search") {
    postQ = event.target.value;
    const el = document.getElementById("post-list");
    if (el) el.innerHTML = renderPostCards();
  }
});

document.addEventListener("click", (event) => {
  const target = event.target.closest("button, [data-open-wall]");
  if (!target) return;

  const openId = target.getAttribute("data-open-wall");
  if (openId) {
    discardPendingPhotos();
    openWallId = openId;
    // A query typed on one wall must not silently filter the next one's
    // messages — the box is gone from view but the state would survive.
    postQ = "";
    view = "wall";
    error = "";
    loadPosts(openId).then(render).catch((e) => { error = e.message; render(); });
    return;
  }
  if (target.matches("[data-refresh]")) { refresh(); return; }
  if (target.matches("[data-new-wall]")) { discardPendingPhotos(); view = "new-wall"; error = ""; render(); return; }
  if (target.matches("[data-back]")) { discardPendingPhotos(); openWallId = null; postQ = ""; view = "list"; error = ""; render(); return; }
  if (target.matches("[data-back-to-wall]")) { view = "wall"; error = ""; render(); return; }
  // Leaving the composer for settings abandons any photo uploaded but not yet
  // posted — reclaim it rather than leaving bytes nothing references.
  if (target.matches("[data-settings]")) { discardPendingPhotos(); view = "settings"; error = ""; render(); return; }
  if (target.hasAttribute("data-delete-wall")) { deleteWall(target.getAttribute("data-delete-wall")); return; }
  if (target.hasAttribute("data-drop-photo")) { dropPendingPhoto(target.getAttribute("data-drop-photo")); return; }
  if (target.hasAttribute("data-delete-post")) { deletePost(target.getAttribute("data-delete-post")); return; }
  if (target.hasAttribute("data-post-status")) {
    setPostStatus(target.getAttribute("data-post-status"), target.getAttribute("data-status"));
    return;
  }
  if (target.hasAttribute("data-share")) { openShareModal(target.getAttribute("data-share")); return; }
  if (target.hasAttribute("data-share-create")) { createShare(target.getAttribute("data-share-create")); return; }
  if (target.hasAttribute("data-share-copy")) { copyShare(target.getAttribute("data-share-copy")); return; }
  if (target.hasAttribute("data-share-revoke")) {
    revokeShare(target.getAttribute("data-share-revoke"), target.getAttribute("data-wall-id"));
    return;
  }
  if (target.matches("[data-share-close]")) { closeShareModal(); return; }
});

document.addEventListener("submit", (event) => {
  event.preventDefault();
  if (event.target.id === "wall-form") createWall(event.target);
  else if (event.target.id === "settings-form") saveWallSettings(event.target);
  else if (event.target.id === "post-form") createPost(event.target);
});

document.addEventListener("change", (event) => {
  if (event.target.id === "photos") { addPendingPhotos(event.target); return; }
  if (event.target.id === "cover") { setCoverPhoto(event.target); return; }
});

refresh();
</script>
</body>
</html>
